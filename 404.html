<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Page introuvable — ACDEES</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="shared.css"/>
  <style>
    .not-found {
      min-height: calc(100vh - 80px);
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 40px 20px;
      background: radial-gradient(ellipse 60% 60% at 50% 40%, rgba(31,122,61,.08), transparent 70%);
    }
    .not-found-inner { max-width: 560px; }
    .not-found-code {
      font-family: 'Playfair Display', serif;
      font-size: clamp(6rem, 18vw, 12rem);
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(135deg, var(--green), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }
    .not-found h2 { font-family: 'Playfair Display', serif; font-size: 1.8rem; margin-bottom: 16px; }
    .not-found p { font-size: .95rem; color: rgba(255,255,255,.5); line-height: 1.8; margin-bottom: 40px; }
    .not-found-links { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-bottom: 48px; }
    .quick-links { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 32px; }
    .quick-link {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 16px; text-decoration: none;
      transition: all .3s;
    }
    .quick-link:hover { border-color: var(--border-green); background: rgba(31,122,61,.06); }
    .quick-link-icon { font-size: 1.4rem; margin-bottom: 8px; }
    .quick-link-label { font-size: .8rem; color: rgba(255,255,255,.6); }
  </style>
</head>
<body>
<div id="nav-placeholder"></div>

<div class="not-found">
  <div class="not-found-inner">
    <div class="not-found-code">404</div>
    <h2>Page introuvable</h2>
    <p>La page que vous cherchez n'existe pas ou a été déplacée. Pas de panique — retrouvez votre chemin ci-dessous.</p>
    <div class="not-found-links">
      <a href="index.html" class="btn-green">Retour à l'accueil →</a>
      <a href="contact.html" class="btn-outline">Nous contacter</a>
    </div>
    <div style="font-size:.78rem;color:rgba(255,255,255,.3);margin-bottom:20px;">Ou accédez directement à :</div>
    <div class="quick-links">
      <a href="services.html" class="quick-link"><div class="quick-link-icon">🏛️</div><div class="quick-link-label">Services</div></a>
      <a href="formations.html" class="quick-link"><div class="quick-link-icon">🎓</div><div class="quick-link-label">Formations</div></a>
      <a href="rendez-vous.html" class="quick-link"><div class="quick-link-icon">📅</div><div class="quick-link-label">Rendez-vous</div></a>
      <a href="devis.html" class="quick-link"><div class="quick-link-icon">📋</div><div class="quick-link-label">Devis</div></a>
      <a href="blog.html" class="quick-link"><div class="quick-link-icon">📝</div><div class="quick-link-label">Blog</div></a>
      <a href="espace-client.html" class="quick-link"><div class="quick-link-icon">🔐</div><div class="quick-link-label">Espace client</div></a>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>
<script src="shared.js"></script>
<script>
  document.getElementById('nav-placeholder').innerHTML = ACDEES.nav();
  document.getElementById('footer-placeholder').innerHTML = ACDEES.footer();
</script>
</body>
</html>
